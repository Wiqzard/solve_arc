program: flow_train_discrete_ARC.py
method: bayes
metric:
  goal: minimize
  name: eval/loss

parameters:
  learning-rate:
    values: [0.0001, 0.0002, 0.0003]
  discrete-rate:
    values: [3.0, 5.0, 7.0]

command:
  - ${env}
  - ${interpreter}
  - ${program}
  - --data-root
  - raw_data/ARC-AGI
  - --train-split
  - training
  - --eval-split
  - evaluation
  - --num-demos
  - "3"
  - --image-size
  - "30"
  - --num-colors
  - "12"
  - --embed-dim
  - "512"
  - --depth
  - "14"
  - --num-heads
  - "8"
  - --mlp-ratio
  - "4.0"
  - --dropout
  - "0.0"
  - --batch-size
  - "4"
  - --eval-batch-size
  - "8"
  - --log-every-steps
  - "5"
  - --eval-every-steps
  - "500"
  - --epochs
  - "20"
  - --weight-decay
  - "0"
  - --lr-scheduler
  - cosine
  - --reverse-sampler
  - sample
  - --attention-backend
  - auto
  - --framewise-causal-attention
  - --include-rearc
  - --include-barc
  - --bf16-autocast
  - --compile
  - --sample-steps
  - "20"
  - --use-wandb
  - --wandb-project
  - VisionARC
  - ${args}
