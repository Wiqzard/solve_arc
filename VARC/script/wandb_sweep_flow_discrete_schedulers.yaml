program: flow_train_discrete_ARC.py
method: random #bayes
metric:
  goal: minimize
  name: eval/loss
#early_terminate:
#  type: hyperband
#  min_iter: 3
#  eta: 3
#  strict: true

parameters:
  #learning-rate:
  #  values: [0.0003, 0.0001]
  rope-3d:
    values: [false, true]
  #image-size:
  #  values: [32, 48]
   # values: [32]
    #values: [32, 64]
  depth:
    values: [4, 8, 16, 24, 32]
  embed-dim:
    values: [384, 512, 768, 1024]
  num-heads:
    values: [8, 12, 16, 32]
  nested-dropout:
    values: [false, true]
  #batch-size:
  #  values: [4, 8, 16, 32]
  #rope-base:
  #  values: [256.0, 2048.0]
  #framewise-causal-attention:
  #  values: [false, true]

command:
  - ${env}
  - ${interpreter}
  - -m
  - torch.distributed.run
  - --standalone
  - --nproc_per_node
  - "8"
  - ${program}
  - --ddp
  - --data-root
  - raw_data/ARC-AGI
  - --train-split
  - training
  - --eval-split
  - evaluation
  - --max-demos
  - "10"
  - --image-size
  - "32"
  - --num-colors
  - "12"
  - --embed-dim
  - "512"
  - --depth
  - "10"
  - --num-heads
  - "8"
  - --mlp-ratio
  - "4.0"
  - --dropout
  - "0.0"
  - --framewise-causal-attention
  - --attention-backend
  - auto
  - --batch-size
  - "4"
  - --eval-batch-size
  - "4"
  - --num-workers
  - "8"
  - --log-every-steps
  - "5"
  - --eval-every-steps
  - "500"
  - --epochs
  - "1"
  - --learning-rate
  - "3e-4"
  - --lr-scheduler
  - cosine
  - --discrete-scheduler
  - "cosine"
  - --discrete-rate
  - "5.0"
  - --loss-function
  - "cross_entropy"
  - --min-learning-rate
  - "1e-6"
  - --weight-decay
  - "0"
  - --train-time-discretization-steps
  - "1000"
  - --reverse-sampler
  - sample
  - --sample-steps
  - "40"
  - --include-rearc
  - --rearc-limit
  - "15000"
  - --include-barc
  - --barc-limit
  - "500"
  - --flow-train-resolution-aug
  - --flow-train-translation-aug
  - --bf16-autocast
  - --compile
  - --use-wandb
  - --wandb-project
  - VisionARC
  - --wandb-num-vis-samples
  - "8"
  - --wandb-vis-scale
  - "8"
  - ${args}
